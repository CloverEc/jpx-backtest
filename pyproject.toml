[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_backend"

[project]
name = "jpxbt"
version = "0.1.0"
description = "Deterministic backtesting engine for Japanese equities"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "JPX Backtest Team"}
]

dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
jpxbt = "jpxbt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
